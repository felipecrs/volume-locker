# Separate from the app's package so its dependencies and tests stay out of a plain `cargo test`.
[package]
name = "volume-locker-e2e"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

# Only tests/app.rs has tests, and every test executable boots the VM.
[lib]
test = false
doctest = false

[dependencies]
serde_json = "1.0.154"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
	"Win32_Devices_FunctionDiscovery",
	"Win32_Foundation",
	"Win32_Media_Audio",
	"Win32_Media_Audio_Endpoints",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_Variant",
	"Win32_UI_Accessibility",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_Shell_PropertiesSystem",
	"Win32_UI_WindowsAndMessaging",
] }
