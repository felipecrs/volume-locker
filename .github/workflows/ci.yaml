name: ci

on:
  push:
    branches:
      - master
    tags:
      - v*.*.*
  pull_request:
    branches:
      - master

jobs:
  ci:
    runs-on: windows-latest
    permissions:
      contents: write # for release
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: jdx/mr-boxington-action@v1
      - run: mise run fmt
      - run: mise run lint
      - run: mise run test
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          sed -i "s/^version = \"0.0.0-development\"$/version = \"${version}\"/" Cargo.toml Cargo.lock
          grep -q "^version = \"${version}\"$" Cargo.toml Cargo.lock
      - run: mise run build
      # The runner is a throwaway machine with a real desktop session, so the end-to-end
      # tests run on it directly, against the release build, instead of in the VM.
      - name: Prepare for the end-to-end tests
        run: |
          Set-Service audiosrv -StartupType Automatic
          Start-Service audiosrv
          $installer = "$env:RUNNER_TEMP\USBip-x64.exe"
          # Keep the version and hash in sync with e2e/provision.sh.
          Invoke-WebRequest https://github.com/vadimgrn/usbip-win2/releases/download/v.0.9.8.1/USBip-0.9.8.1-x64.exe -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '38CAD6D4432B52D5BB9409D9AD03B72FDFFC4ADA4CD3A48FBECA1A2752A8518A') { throw 'unexpected installer hash' }
          Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          if (-not (Test-Path 'C:\Program Files\USBip\usbip.exe')) { throw 'usbip-win2 did not install' }
      - name: Run the end-to-end tests
        working-directory: e2e
        env:
          VOLUME_LOCKER_E2E: "1"
          # Runs the tests directly, instead of in the VM as .cargo/config.toml says.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER: cmd /c
        run: |
          cargo test --locked --no-run
          Copy-Item ..\target\release\VolumeLocker.exe target\debug\deps\
          cargo test --locked
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          make_latest: true
          files: |
            target/release/VolumeLocker.exe
