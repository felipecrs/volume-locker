[tools]
rust = { version = "1.99.1", components = ["rustfmt", "clippy"], profile = "minimal", mr_boxington = true }
mr-boxington = "v1.29.2"

[tasks.fmt]
description = "Check code formatting"
run = ["cargo fmt --check", "cargo fmt --check --manifest-path e2e/Cargo.toml"]

[tasks."fmt:fix"]
description = "Format code"
alias = ["format"]
run = ["cargo fmt", "cargo fmt --manifest-path e2e/Cargo.toml"]

[tasks.lint]
description = "Run Clippy linter"
run = [
  "cargo clippy --locked --all-targets",
  "cargo clippy --locked --all-targets --manifest-path e2e/Cargo.toml",
]

[tasks.test]
description = "Run tests"
run = "cargo test --locked"

[tasks.check]
description = "Run all checks (format, lint, test)"
depends = ["fmt", "lint", "test"]

[tasks.build]
description = "Build release binary"
run = "cargo build --release --frozen"

[tasks.e2e]
description = "Run the end-to-end tests in a Windows VM"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File e2e/run.ps1"

[tasks."e2e:provision"]
description = "Build the Windows VM image for the end-to-end tests"
run = "wsl.exe bash e2e/provision.sh"
