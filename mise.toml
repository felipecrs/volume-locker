[tools]
rust = { version = "1.99.1", components = ["rustfmt", "clippy"], profile = "minimal", mr_boxington = true }
mr-boxington = "v1.29.2"

[tasks.fmt]
description = "Check code formatting"
run = "cargo fmt --all --check"

[tasks."fmt:fix"]
description = "Format code"
alias = ["format"]
run = "cargo fmt --all"

[tasks.lint]
description = "Run Clippy linter"
run = "cargo clippy --locked --workspace --all-targets"

[tasks.test]
description = "Run tests"
run = "cargo test --locked"

[tasks.check]
description = "Run all checks (format, lint, test)"
depends = ["fmt", "lint", "test"]

[tasks.build]
description = "Build release binary"
run = "cargo build --release --frozen"

[tasks.e2e]
description = "Run the end-to-end tests in a Windows VM. Arguments after -- go to the tests."
# From e2e/, so cargo uses its .cargo/config.toml. mise appends arguments to the last command.
dir = "{{config_root}}/e2e"
run = [
  "cargo build --package volume-locker --release --locked",
  "cargo test --locked --",
]